{% extends "base.html" %}
{% block body %}
<div style="max-width:400px;margin:70px auto">
  <div class="brand" style="font-size:22px;margin-bottom:18px;text-align:center">Claim<span>sight</span></div>
  <div class="card">
    <h1 style="font-size:19px;margin-bottom:16px">Sign in</h1>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" required autofocus>
      <label for="password">Password</label>
      <input id="password" type="password" name="password" required>
      <p style="margin:20px 0 0"><button class="btn" style="width:100%" type="submit">Sign in</button></p>
    </form>
  </div>
  <p class="small muted" style="text-align:center;margin-top:16px">
    No account? <a href="/signup">Create one</a>
  </p>
</div>
{% endblock %}
