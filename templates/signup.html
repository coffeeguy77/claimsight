{% extends "base.html" %}
{% block title %}Create account — ClaimSight{% endblock %}
{% block anon %}
<div style="min-height:100vh;display:grid;place-items:center;padding:32px;background:var(--app-bg)">
  <div style="width:100%;max-width:420px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:22px;justify-content:center">
      <img src="/static/logo-light.svg?v={{ asset_v }}" alt="ClaimSight" width="200" height="50" style="height:50px;width:auto;display:block">
    </div>
    <div class="card" style="padding:26px">
      <h1 style="font-size:21px;margin-bottom:4px">Create your account</h1>
      <p style="font-size:13.5px;color:var(--text-secondary);margin:0 0 20px">
        Claims are private to your assessing firm.</p>
      {% if error %}
      <div style="background:var(--red-100);border:1px solid #F2CFCF;color:var(--red-600);
                  padding:10px 13px;border-radius:8px;font-size:13px;margin-bottom:14px">{{ error }}</div>
      {% endif %}
      <form method="post" action="/signup">
        <div class="field"><label for="organisation">Assessing firm</label>
          <input id="organisation" type="text" name="organisation" required autofocus
                 placeholder="e.g. Revive Disaster Recovery Pty Ltd"></div>
        <div class="field"><label for="name">Your name</label>
          <input id="name" type="text" name="name" autocomplete="name"></div>
        <div class="field"><label for="email">Email</label>
          <input id="email" type="email" name="email" required autocomplete="email"></div>
        <div class="field"><label for="password">Password</label>
          <input id="password" type="password" name="password" required minlength="8"
                 autocomplete="new-password">
          <p style="font-size:11.5px;color:var(--text-muted);margin:6px 0 0">At least 8 characters.</p></div>
        <button class="btn block" type="submit" style="margin-top:6px">Create account</button>
      </form>
    </div>
    <p style="font-size:13px;color:var(--text-secondary);text-align:center;margin-top:16px">
      Already registered? <a href="/login">Sign in</a></p>
  </div>
</div>
{% endblock %}
